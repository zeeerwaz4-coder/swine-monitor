<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realistic Walking Human</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    background:
    linear-gradient(to top,#c97b30 0%,#d99849 20%,#f0c27b 45%,#ffd89b 70%,#87ceeb 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

.sun{
    position:absolute;
    top:70px;
    right:120px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#fff1a8;
    box-shadow:0 0 80px #fff3b0;
}

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:220px;
    background:linear-gradient(to top,#a85b20,#d98d44);
}

.dune1,
.dune2{
    position:absolute;
    border-radius:50%;
    background:#d99849;
    filter:blur(2px);
}

.dune1{
    width:700px;
    height:220px;
    bottom:120px;
    left:-100px;
}

.dune2{
    width:800px;
    height:260px;
    bottom:90px;
    right:-150px;
    background:#c97b30;
}

.scene{
    position:relative;
    width:100%;
    height:100%;
}

.character{
    position:absolute;
    bottom:175px;
    left:-220px;
    width:160px;
    height:420px;
    animation:moveForward 14s linear infinite;
}

.shadow{
    position:absolute;
    bottom:0;
    left:25px;
    width:95px;
    height:22px;
    background:rgba(0,0,0,0.28);
    border-radius:50%;
    filter:blur(8px);
    animation:shadowMove 1s ease-in-out infinite;
}

.body{
    position:absolute;
    bottom:35px;
    left:40px;
    width:80px;
    height:260px;
    animation:bodyBounce 1s ease-in-out infinite;
}

.head{
    position:absolute;
    top:0;
    left:18px;
    width:45px;
    height:55px;
    background:#f1c27d;
    border-radius:50%;
    z-index:5;
    box-shadow:inset -5px -4px rgba(0,0,0,0.08);
}

.hair{
    position:absolute;
    top:-2px;
    left:4px;
    width:37px;
    height:22px;
    background:#1f1f1f;
    border-radius:20px 20px 8px 8px;
}

.neck{
    position:absolute;
    top:48px;
    left:30px;
    width:15px;
    height:18px;
    background:#e0ac69;
    z-index:2;
}

.torso{
    position:absolute;
    top:60px;
    left:5px;
    width:70px;
    height:115px;
    background:#2f5d9f;
    border-radius:18px;
    z-index:1;
    box-shadow:inset -10px 0 rgba(0,0,0,0.12);
}

.arm{
    position:absolute;
    width:18px;
    height:95px;
    transform-origin:top center;
}

.arm .upper{
    position:absolute;
    width:18px;
    height:52px;
    background:#2f5d9f;
    border-radius:12px;
}

.arm .lower{
    position:absolute;
    top:42px;
    left:1px;
    width:16px;
    height:48px;
    background:#f1c27d;
    border-radius:12px;
}

.arm.left{
    top:70px;
    left:-8px;
    animation:armLeft 1s ease-in-out infinite;
}

.arm.right{
    top:70px;
    right:-8px;
    animation:armRight 1s ease-in-out infinite;
}

.leg{
    position:absolute;
    width:22px;
    height:140px;
    top:165px;
    transform-origin:top center;
}

.leg .thigh{
    position:absolute;
    width:22px;
    height:72px;
    background:#1f2c3d;
    border-radius:14px;
}

.leg .shin{
    position:absolute;
    top:62px;
    width:20px;
    height:65px;
    background:#2d3e50;
    border-radius:14px;
}

.foot{
    position:absolute;
    bottom:-6px;
    width:34px;
    height:14px;
    background:#111;
    border-radius:12px;
}

.leg.left{
    left:12px;
    animation:legLeft 1s ease-in-out infinite;
}

.leg.right{
    right:12px;
    animation:legRight 1s ease-in-out infinite;
}

.leg.left .foot{
    left:-5px;
}

.leg.right .foot{
    left:-5px;
}

.dust{
    position:absolute;
    bottom:160px;
    width:12px;
    height:12px;
    border-radius:50%;
    background:rgba(255,255,255,0.35);
    animation:dustFly 2s linear infinite;
}

.d1{left:30%; animation-delay:0s;}
.d2{left:60%; animation-delay:0.5s;}
.d3{left:75%; animation-delay:1s;}

@keyframes legLeft{
    0%{transform:rotate(30deg);}
    50%{transform:rotate(-30deg);}
    100%{transform:rotate(30deg);}
}

@keyframes legRight{
    0%{transform:rotate(-30deg);}
    50%{transform:rotate(30deg);}
    100%{transform:rotate(-30deg);}
}

@keyframes armLeft{
    0%{transform:rotate(-28deg);}
    50%{transform:rotate(28deg);}
    100%{transform:rotate(-28deg);}
}

@keyframes armRight{
    0%{transform:rotate(28deg);}
    50%{transform:rotate(-28deg);}
    100%{transform:rotate(28deg);}
}

@keyframes bodyBounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
}

@keyframes shadowMove{
    0%,100%{transform:scaleX(1);}
    50%{transform:scaleX(0.82);}
}

@keyframes moveForward{
    0%{left:-220px;}
    100%{left:110%;}
}

@keyframes dustFly{
    0%{
        transform:translateY(0) scale(1);
        opacity:0;
    }

    30%{
        opacity:1;
    }

    100%{
        transform:translateY(-70px) translateX(40px) scale(2);
        opacity:0;
    }
}

</style>
</head>
<body>

<div class="scene">

    <div class="sun"></div>

    <div class="dune1"></div>
    <div class="dune2"></div>

    <div class="dust d1"></div>
    <div class="dust d2"></div>
    <div class="dust d3"></div>

    <div class="character">

        <div class="shadow"></div>

        <div class="body">

            <div class="head">
                <div class="hair"></div>
            </div>

            <div class="neck"></div>

            <div class="torso"></div>

            <div class="arm left">
                <div class="upper"></div>
                <div class="lower"></div>
            </div>

            <div class="arm right">
                <div class="upper"></div>
                <div class="lower"></div>
            </div>

            <div class="leg left">
                <div class="thigh"></div>
                <div class="shin"></div>
                <div class="foot"></div>
            </div>

            <div class="leg right">
                <div class="thigh"></div>
                <div class="shin"></div>
                <div class="foot"></div>
            </div>

        </div>

    </div>

    <div class="ground"></div>

</div>

</body>
  </html>
