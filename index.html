<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swine Monitoring System</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#071b11;
    overflow-x:hidden;
    color:white;
}

/* AI MOVING BACKGROUND */

.ai-bg{
    position:fixed;
    top:0;
    left:0;
    width:200%;
    height:200%;
    background:
    repeating-linear-gradient(
        90deg,
        rgba(0,255,120,0.08) 0px,
        rgba(0,255,120,0.08) 2px,
        transparent 2px,
        transparent 60px
    );

    animation:moveGrid 10s linear infinite;
    z-index:-2;
}

@keyframes moveGrid{
    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-60px);
    }
}

/* GLOW EFFECT */

.glow{
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(
        circle,
        rgba(0,255,120,0.15),
        transparent 70%
    );

    top:-100px;
    right:-100px;
    z-index:-1;
}

/* HEADER */

header{
    text-align:center;
    padding:30px 20px;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(5px);
}

header h1{
    margin:0;
    font-size:38px;
    color:#7CFFB2;
}

header p{
    color:#d0ffd9;
}

/* MAIN CONTAINER */

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
    padding:30px 0;
}

/* CARDS */

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:25px;
    margin-bottom:30px;
    backdrop-filter:blur(8px);
    box-shadow:0 0 15px rgba(0,255,120,0.15);
}

/* FLOATING PIG */

.floating-pig{
    width:180px;
    display:block;
    margin:20px auto;
    animation:floatPig 4s ease-in-out infinite;
}

@keyframes floatPig{
    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-15px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* BUTTONS */

button{
    background:#00cc66;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    background:#00ff88;
    transform:scale(1.05);
}

/* FORM */

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input,
textarea{
    padding:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    color:white;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input::placeholder,
textarea::placeholder{
    color:#d0ffd9;
}

/* FOOTER */

footer{
    text-align:center;
    padding:20px;
    background:rgba(0,0,0,0.4);
    color:#d0ffd9;
}

/* MOBILE */

@media(max-width:768px){

    header h1{
        font-size:28px;
    }

    .floating-pig{
        width:130px;
    }

}

</style>
</head>

<body>

<div class="ai-bg"></div>
<div class="glow"></div>

<header>
    <h1>Swine Monitoring System</h1>
    <p>AI Powered Pig Farm Monitoring</p>
</header>

<div class="container">

    <div class="card">

        <img src="pig.png" class="floating-pig">

        <h2>Smart Monitoring</h2>

        <p>
            Monitor pig health, feeding,
            environment, and farm records
            using modern AI technology.
        </p>

        <button>View Dashboard</button>

    </div>

    <div class="card">

        <h2>Contact Us</h2>

        <form>

            <input type="text" placeholder="Your Name">

            <input type="email" placeholder="Your Email">

            <textarea placeholder="Your Message"></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</div>

<footer>
    Swine Monitoring System © 2026
</footer>

</body>
</html>
